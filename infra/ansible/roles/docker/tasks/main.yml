# Docker Engine + Compose plugin từ kho apt chính thức; cập nhật bảo mật tự động (Spec Mục 9.1).
- name: Gói nền
  ansible.builtin.apt:
    name: [ca-certificates, curl, unattended-upgrades]
    update_cache: true

- name: Khóa apt của Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Kho apt của Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker

- name: Docker Engine + Compose
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    update_cache: true

- name: Bật Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
