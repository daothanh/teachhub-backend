- name: Thư mục ứng dụng
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: ["", caddy, postgres-init, minio]

- name: Chứng chỉ Origin CA
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ app_dir }}/caddy/{{ item.name }}"
    mode: "{{ item.mode }}"
  loop:
    - { name: origin.pem, content: "{{ origin_cert_pem }}", mode: "0644" }
    - { name: origin.key, content: "{{ origin_key_pem }}", mode: "0600" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Restart caddy

- name: Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ app_dir }}/caddy/Caddyfile"
    mode: "0644"
  notify: Restart caddy

# Dùng lại script của local để bucket dev giống local/R2 (Mục 2.8).
- name: Script khởi tạo MinIO
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../../docker/minio/init.sh"
    dest: "{{ app_dir }}/minio/init.sh"
    mode: "0755"

- name: Script tạo vai trò PostgreSQL
  ansible.builtin.copy:
    src: 01-roles.sh
    dest: "{{ app_dir }}/postgres-init/01-roles.sh"
    mode: "0755"

# User deploy (CD) chạy `docker compose` nên cần đọc compose.yml + backend.env: root:deploy 0640.
- name: User deploy cho CD (chỉ nhóm docker, không sudo)
  ansible.builtin.user:
    name: deploy
    shell: /bin/bash
    groups: docker
    append: true
    password_lock: true
  when: deploy_ssh_pubkey is defined

# Dùng module builtin (không cần collection ansible.posix).
- name: Thư mục .ssh của deploy
  ansible.builtin.file:
    path: /home/deploy/.ssh
    state: directory
    owner: deploy
    group: deploy
    mode: "0700"
  when: deploy_ssh_pubkey is defined

- name: Khóa SSH của deploy
  ansible.builtin.copy:
    content: "{{ deploy_ssh_pubkey }}\n"
    dest: /home/deploy/.ssh/authorized_keys
    owner: deploy
    group: deploy
    mode: "0600"
  when: deploy_ssh_pubkey is defined

# Tag image do CD ghi; force: false để chạy lại Ansible không đè tag đang chạy.
- name: .env của compose (IMAGE_TAG)
  ansible.builtin.copy:
    content: "IMAGE_TAG=main\n"
    dest: "{{ app_dir }}/.env"
    force: false
    owner: "{{ 'deploy' if deploy_ssh_pubkey is defined else 'root' }}"
    mode: "0644"

# Chứa mật khẩu và khóa JWT → không cho người ngoài đọc.
- name: Compose + biến môi trường backend
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ app_dir }}/{{ item }}"
    group: "{{ 'deploy' if deploy_ssh_pubkey is defined else 'root' }}"
    mode: "0640"
  loop: [compose.yml, backend.env]
  no_log: true

- name: Đăng nhập GHCR (image private)
  ansible.builtin.command:
    cmd: docker login ghcr.io -u {{ ghcr_user }} --password-stdin
    stdin: "{{ ghcr_token }}"
  when: ghcr_token is defined
  no_log: true
  changed_when: false

- name: Kéo image và chạy stack
  ansible.builtin.command:
    cmd: docker compose up -d --pull always --remove-orphans
    chdir: "{{ app_dir }}"
  register: up
  changed_when: "'Started' in up.stderr or 'Recreated' in up.stderr"

- name: Chờ /health/ready (db + redis + s3)
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T api node -e
      "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
    chdir: "{{ app_dir }}"
  register: ready
  retries: 12
  delay: 5
  until: ready.rc == 0
  changed_when: false
