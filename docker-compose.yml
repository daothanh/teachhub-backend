# Môi trường local (Mục 9.1): PostgreSQL 17, Redis 7, MinIO (thay R2), Mailpit (bắt email OTP).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ['${PG_PORT:-5433}:5432']
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d teachhub']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['${REDIS_PORT:-6380}:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # Ghim theo digest (R28). minio/minio đã rời Docker Hub/Quay; Chainguard chỉ phát hành tag `latest`.
  # Nâng cấp: docker buildx imagetools inspect chainguard/minio:latest → thay digest.
  minio:
    image: chainguard/minio@sha256:0f9fda72fbc6bd3560ea903aec2ceefa20f6ba82628d67656f37fb370c39ae9c
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
      MC_HOST_local: http://minio:minio12345@localhost:9000 # cho healthcheck
      # CORS cho upload thẳng bằng presigned URL; MinIO chỉ hỗ trợ ở cấp server.
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:-*}
    ports: ['${MINIO_PORT:-9000}:9000', '${MINIO_CONSOLE_PORT:-9001}:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  # Chạy một lần rồi thoát: tạo bucket, CORS, lifecycle (docker/minio/init.sh). Image MinIO có sẵn `mc` và `sh`.
  minio-init:
    image: chainguard/minio@sha256:0f9fda72fbc6bd3560ea903aec2ceefa20f6ba82628d67656f37fb370c39ae9c
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/init.sh']
    environment:
      MC_HOST_local: http://minio:minio12345@minio:9000
    volumes: ['./docker/minio/init.sh:/init.sh:ro']

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports: ['1025:1025', '8025:8025']

  # Mock API cho client (S0-FL-10): trả ví dụ trong hợp đồng, validate request theo schema.
  # Chỉ chạy khi gọi profile: pnpm mock (docker compose --profile mock up mock).
  mock:
    profiles: ['mock']
    image: stoplight/prism:5.15.10
    command: ['mock', '-h', '0.0.0.0', '--multiprocess=false', '/contracts/openapi.json']
    ports: ['${MOCK_PORT:-4010}:4010']
    volumes: ['./contracts:/contracts:ro']

volumes:
  pg-data:
  redis-data:
  minio-data:
