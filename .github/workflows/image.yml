name: image

# PR: build + quét Trivy (không push). Merge main: build, quét, push GHCR — CD dev (S0-OPS-02) kéo tag `main`.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      NAME: teachhub-backend # một image cho api, worker, migrate (khác lệnh chạy)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Chạy Trivy bằng image ghim phiên bản thay cho trivy-action (tag của action từng bị chiếm quyền).
      - name: Trivy (CRITICAL, HIGH có bản vá → đỏ)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress
          ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
      - if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        # Tên image GHCR phải viết thường (org có thể có chữ hoa).
        run: docker push --all-tags "$(echo "ghcr.io/${{ github.repository_owner }}/$NAME" | tr '[:upper:]' '[:lower:]')"
