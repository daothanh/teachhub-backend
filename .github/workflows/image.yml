name: image

# PR: build + quét Trivy (không push). Merge main: build, quét, push GHCR — CD dev (S0-OPS-02) kéo tag `main`.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: teachhub-backend # api + worker (khác lệnh chạy)
            target: runtime
          - name: teachhub-migrate
            target: migrate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      # Chạy Trivy bằng image ghim phiên bản thay cho trivy-action (tag của action từng bị chiếm quyền).
      - name: Trivy (CRITICAL, HIGH có bản vá → đỏ)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress
          ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        # Tên image GHCR phải viết thường (org có thể có chữ hoa).
        run: docker push --all-tags "$(echo 'ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}' | tr '[:upper:]' '[:lower:]')"
