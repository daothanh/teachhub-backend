name: deploy-staging

# S3-OPS-01: push tag `v<semver>` → image.yml build+push image `v<semver>` → migrate (teachhub_owner) → up -d trên VM staging.
# Cần duyệt tay? Bật Required reviewers ở GitHub Environment `staging` (tùy Owner).
# Runner vào VM qua Tailscale (cổng 22 công khai chỉ mở cho IP admin). Xem infra/README.md mục Staging.
on:
  workflow_run:
    workflows: [image]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag image cần deploy (vd v1.2.3, hoặc sha-<40 hex> để quay lại bản cũ)

# Một deploy một lúc; deploy sau xếp hàng chờ chứ không hủy deploy đang chạy dở (migrate giữa chừng).
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    # workflow_run kích hoạt cả với PR/failed/push main: chỉ nhận push tag `v*` (head_branch là tên tag) và build thành công.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Kiểm tra tag
        run: '[[ "$TAG" =~ ^(sha-[0-9a-f]{40}|v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.]+)?)$ ]] || { echo "Tag không hợp lệ"; exit 1; }'

      - uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Thiết lập SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Khóa chỉ chạy được `teachhub-deploy` trên VM (forced command): lệnh gửi đi là tag, token ở stdin.
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_TARGET" "$TAG"
