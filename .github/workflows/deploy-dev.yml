name: deploy-dev

# S0-OPS-02: image.yml build+push xong trên main → migrate (teachhub_owner) → up -d trên VM dev.
# Runner vào VM qua Tailscale (cổng 22 công khai chỉ mở cho IP admin). Xem infra/README.md mục CD.
on:
  workflow_run:
    workflows: [image]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag image cần deploy (vd sha-<40 hex> hoặc main)
        default: main

# Một deploy một lúc; deploy sau xếp hàng chờ chứ không hủy deploy đang chạy dở (migrate giữa chừng).
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    # workflow_run kích hoạt cả với PR/failed: chỉ nhận push lên main và build thành công.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || format('sha-{0}', github.event.workflow_run.head_sha) }}
    steps:
      - name: Kiểm tra tag
        run: '[[ "$TAG" =~ ^(main|sha-[0-9a-f]{40})$ ]] || { echo "Tag không hợp lệ"; exit 1; }'

      - uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Thiết lập SSH
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_TARGET: ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Token GHCR đi qua stdin của ssh, không nằm trên dòng lệnh; script truyền làm đối số `bash -c`.
          SCRIPT=$(cat <<'REMOTE'
          set -euo pipefail
          tag=$1; actor=$2
          cd /opt/teachhub
          read -r token
          printf '%s' "$token" | docker login ghcr.io -u "$actor" --password-stdin >/dev/null
          old=$(sed -n 's/^IMAGE_TAG=//p' .env)
          export IMAGE_TAG=$tag   # ghi đè .env cho pull/migrate; .env chỉ đổi sau khi migrate xong
          docker compose pull api worker migrate
          docker compose run -T --rm migrate   # one-shot; mã thoát ≠ 0 dừng deploy, api/worker vẫn chạy bản cũ
          echo "IMAGE_TAG=$tag" > .env
          docker compose up -d --remove-orphans api worker
          for i in $(seq 1 24); do
            if docker compose exec -T api node -e "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"; then
              echo "OK: $tag"; exit 0
            fi
            sleep 5
          done
          echo "api không ready sau 120s (tag cũ: ${old:-?})"; docker compose logs --tail=50 api; exit 1
          REMOTE
          )
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_TARGET" "$(printf '%q ' bash -c "$SCRIPT" _ "$TAG" "$GITHUB_ACTOR")"
