name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Testcontainers (PostgreSQL 17, Redis) dùng Docker sẵn có trên runner.
      - run: pnpm test:e2e
      - run: pnpm build

  # Chặn thay đổi phá vỡ hợp đồng so với nhánh đích (Mục 5.1). Lệch mã ↔ openapi.json đã bắt ở `pnpm test`.
  openapi-breaking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hợp đồng của nhánh đích
        run: |
          git show "origin/${{ github.base_ref }}:contracts/openapi.json" > base.json 2>/dev/null \
            || echo '{"openapi":"3.1.0","info":{"title":"","version":""},"paths":{}}' > base.json
      - name: oasdiff breaking
        run: docker run --rm -v "$PWD:/w" tufin/oasdiff:v1.38.0 breaking /w/base.json /w/contracts/openapi.json --fail-on ERR
