name: ci

# Chỉ chạy trên PR (main chỉ nhận squash từ PR đã xanh); bỏ qua PR chỉ đổi tài liệu/hạ tầng — tiết kiệm phút Actions.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'infra/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Mỗi job là một check riêng trên PR (DoD Sprint 0 #5): lint, unit (gồm openapi.json khớp mã),
# migrate, rls, e2e, build, openapi-breaking.
jobs:
  # lint + typecheck + unit + build + hợp đồng: chung một lần cài đặt (mỗi job tính phút làm tròn lên).
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Chặn thay đổi phá vỡ hợp đồng so với nhánh đích (Mục 5.1). Lệch mã ↔ openapi.json đã bắt ở `pnpm test`.
      - name: Hợp đồng của nhánh đích
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:contracts/openapi.json" > base.json 2>/dev/null \
            || echo '{"openapi":"3.1.0","info":{"title":"","version":""},"paths":{}}' > base.json
      - name: oasdiff breaking
        if: github.event_name == 'pull_request'
        run: docker run --rm -v "$PWD:/w" tufin/oasdiff:v1.38.0 breaking /w/base.json /w/contracts/openapi.json --fail-on ERR

  # Migration thật bằng scripts/migrate.mjs + vai trò teachhub_owner, đúng lệnh của image khi deploy (ADR-TH-BE-001).
  migrate:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      MIGRATION_DATABASE_URL: postgres://teachhub_owner:teachhub_owner@localhost:5432/teachhub
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Thứ tự migration (so với nhánh đích)
        run: |
          base="$RUNNER_TEMP/base-journal.json"
          if [ -n "${{ github.base_ref }}" ]; then
            git show "origin/${{ github.base_ref }}:libs/db/migrations/meta/_journal.json" > "$base" 2>/dev/null || rm -f "$base"
          fi
          node scripts/check-migrations.mjs "$base"
      - name: Vai trò CSDL (như Ansible ở staging/production)
        run: psql -v ON_ERROR_STOP=1 -f docker/postgres-init/01-roles.sql
      - name: Migration trên CSDL trống, chạy lại lần hai không lỗi
        run: |
          node scripts/migrate.mjs
          node scripts/migrate.mjs

  # Gồm cả test/rls-coverage.e2e-spec.ts (R1 §4.5: bảng public thiếu enable/force RLS → đỏ).
  e2e:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Testcontainers (PostgreSQL 17, Redis 7, MinIO) dùng Docker sẵn có trên runner.
      - run: pnpm test:e2e
